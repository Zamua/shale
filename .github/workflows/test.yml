name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet + build + race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test ./... -race -timeout 300s

  test-stress:
    name: integration stress (-count=3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: integration tests (race, count=3)
        run: go test ./tests/integration/... -race -count=3 -timeout 600s
