name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet + build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      # Workspace-mode dev loop: vet + build + tests across every
      # module in go.work (core + backends/pebble + backends/slate).
      # `go test ./...` only walks the current module, so each module
      # needs its own invocation; go.work transparently resolves cross-
      # module deps without bumping versions between them.
      #
      # MODULES is the canonical list of go.work members. Append a new
      # backend here when it lands.
      - name: go vet (workspace, all modules)
        run: |
          set -euo pipefail
          MODULES=(. backends/pebble backends/slate)
          for m in "${MODULES[@]}"; do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...)
            echo "::endgroup::"
          done

      - name: go build (workspace, all modules)
        run: |
          set -euo pipefail
          MODULES=(. backends/pebble backends/slate)
          for m in "${MODULES[@]}"; do
            echo "::group::go build $m"
            (cd "$m" && go build ./...)
            echo "::endgroup::"
          done

      # Full test suite under the race detector. Serialized across
      # packages (-p 1) and within each package (-parallel 1) so the
      # 3-node in-process integration fixtures plus race-detector
      # shadow memory fit inside ubuntu-latest's RAM budget. Local
      # peak RSS measured at ~3 GB with this shape, vs ~4 GB at
      # default parallelism with high variance; serial trades a
      # minute of wall clock for a predictable upper bound.
      - name: go test (race, workspace, all modules)
        # Split timeouts by package speed. The fast packages get a TIGHT
        # per-package timeout so a fixture perf regression - reverting to the 30s
        # RebalanceGraceDuration default, or dropping the fast-sweep / short-settle
        # test init - trips CI instead of hiding under a generous budget.
        # pkg/cluster (the heaviest fast package) runs in ~113s under -race
        # locally; 360s carries ample margin for a slower CI runner while still
        # catching a multi-minute regression (the whole fast set was ~600s before
        # the grace/settle/sweep fixes).
        #
        # The integration package keeps the larger budget: its graceful-leave and
        # overlap gates are DELIBERATELY slow (multi-second artificial mounts that
        # exercise the slow-handoff regime), so that runtime is the floor, not
        # waste.
        #
        # RAISING EITHER TIMEOUT IS A LAST RESORT. First profile the suite
        # (`go test ./<pkg> -v` then sort tests by duration) and optimize the slow
        # fixtures: almost every multi-second UNIT test is a fixed convergence
        # delay (rebalance grace / settle debounce / sweep tick), not real work.
        # The test-wide tunables live in pkg/cluster/gossip_fast_test.go and
        # tests/integration/helpers_test.go (SetSweepInterval /
        # SetDefaultGraceDuration / defaultSettleDelay). Shorten a fixture before
        # you touch these numbers.
        run: |
          set -euo pipefail
          FAST_TIMEOUT=360s
          SLOW_TIMEOUT=600s
          # Root module: fast packages on the tight budget, integration on the
          # slow one (go list emits full import paths, so the suffix match is exact).
          echo "::group::go test root fast packages"
          go test $(go list ./... | grep -v '/tests/integration$') \
            -race -timeout "$FAST_TIMEOUT" -p 1 -parallel 1
          echo "::endgroup::"
          echo "::group::go test ./tests/integration (slow gates)"
          go test ./tests/integration -race -timeout "$SLOW_TIMEOUT" -p 1 -parallel 1
          echo "::endgroup::"
          # Backend modules (separate go.mod) keep the generous budget.
          for m in backends/pebble backends/slate; do
            echo "::group::go test $m"
            (cd "$m" && go test ./... -race -timeout "$SLOW_TIMEOUT" -p 1 -parallel 1)
            echo "::endgroup::"
          done

      # Per-module release-validation pass: each backend module must
      # also build standalone with GOWORK=off so the published module
      # graph is self-consistent (no implicit workspace dependency on
      # sibling modules via go.work replace directives). Catches the
      # case where a backend forgets to require a dep in its own
      # go.mod and only compiles because the workspace had it.
      #
      # The slate module's slatedb tag is NOT exercised here because
      # it requires the cgo toolchain + a locally-built libslatedb_uniffi
      # cdylib; that path is covered by the `test-slate` Makefile target
      # running locally (and a follow-up MinIO CI fixture when it lands).
      - name: per-module build (GOWORK=off)
        run: |
          set -euo pipefail
          BACKENDS=(backends/pebble backends/slate)
          for m in "${BACKENDS[@]}"; do
            echo "::group::GOWORK=off go build $m"
            (cd "$m" && GOWORK=off go build ./...)
            echo "::endgroup::"
          done
