name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet + build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Unit/package tests under the race detector. Integration tests
      # are excluded here because the 3-node in-process cluster + race
      # detector + memberlist gossip exhausts the GitHub runner's 7 GB
      # of RAM and SIGTERM'd the process. They run without -race below.
      - name: go test (race, no integration)
        run: |
          pkgs=$(go list ./... | grep -v /tests/integration)
          go test -race -timeout 300s $pkgs

      - name: go test (integration, no race)
        run: go test -timeout 300s ./tests/integration/...
