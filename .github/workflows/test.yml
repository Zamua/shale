name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast compile gate: vet + build across every go.work module, plus the
  # per-module GOWORK=off build that proves each published module graph is
  # self-consistent. No tests run here - every test runs under the race
  # detector in the `race` matrix below, which IS the behavior gate (a -race
  # run exercises strictly more than a plain run, so a separate non-race test
  # pass would only duplicate coverage and double the wall-clock).
  build:
    name: vet + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - name: go vet + build (workspace, all modules)
        run: |
          set -euo pipefail
          MODULES=(. backends/pebble backends/slate cmd)
          for m in "${MODULES[@]}"; do
            echo "::group::go vet $m"; (cd "$m" && go vet ./...); echo "::endgroup::"
            echo "::group::go build $m"; (cd "$m" && go build ./...); echo "::endgroup::"
          done
      - name: per-module build (GOWORK=off)
        run: |
          set -euo pipefail
          for m in backends/pebble backends/slate cmd; do
            echo "::group::GOWORK=off go build $m"; (cd "$m" && GOWORK=off go build ./...); echo "::endgroup::"
          done

  # FORWARD-PAIRING gate: each published backend against the NEWEST core tag.
  #
  # The per-module GOWORK=off build above proves each module against the core
  # it PINS. That is not the combination a consumer runs. Go's minimal version
  # selection takes the MAX, so a consumer of a core-only release gets the old
  # backend meeting a core it was never built against - a pairing that is
  # created fresh by every release which "does not need a backend bump", and
  # which nothing else here can see (a check on the pin as written is
  # forward-blind by construction).
  #
  # This builds AND tests it, because the other GOWORK=off step is build-only:
  # no module was otherwise exercised against real pins at all.
  forward-pairing:
    name: forward pairing (backends vs newest core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - name: build + test each backend against the newest core tag
        env:
          GOWORK: 'off'
          GOFLAGS: '-mod=mod'
        run: |
          set -euo pipefail
          CORE=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$CORE" ]; then
            echo "no core tag found - refusing to report a pass"; exit 1
          fi
          echo "newest core tag: $CORE"
          for m in backends/pebble backends/slate; do
            echo "::group::$m against core $CORE"
            (
              cd "$m"
              PINNED=$(go list -m -f '{{.Version}}' github.com/Zamua/shale)
              echo "$m pins core $PINNED; consumer resolves $CORE"
              # A pin AHEAD of the newest tag means a breaking core transition
              # is in flight (the backend already tracks an unreleased core, by
              # pseudo-version). Downgrading it to the older tag would fabricate
              # a pairing the repo has explicitly moved past; the real pairing
              # becomes testable when the next core tag exists.
              if [ "$(printf '%s\n%s\n' "$CORE" "$PINNED" | sort -V | tail -1)" != "$CORE" ]; then
                echo "SKIP: $m pin $PINNED is ahead of newest tag $CORE (unreleased core in flight)"
              else
                go get "github.com/Zamua/shale@$CORE"
                go build ./...
                go test ./... -count=1
              fi
            )
            echo "::endgroup::"
          done
          echo "forward pairing clean against $CORE"

  # BLOCKING race-detector gate, fanned out across runners. The race detector
  # is the primary defense against the concurrency bugs a distributed-membership +
  # multi-node-handoff store is prone to, so it gates merges.
  #
  # Why a matrix and not one job: -race carries heavy CPU+memory overhead, and
  # on GitHub's 2-vCPU runners a SINGLE serial job starves the in-process
  # multi-node fixtures - the 3-node convergence goroutines don't get scheduled
  # promptly, so per-test write-readiness/rebalance-idle budgets blow and the
  # whole run drags past 20 minutes. Splitting the heavy packages across
  # independent runners keeps each runner's load light (so convergence stays
  # fast and the budgets hold) AND makes wall-clock = the slowest slice, not the
  # sum. pkg/cluster (the heavy package here) is name-sharded round-robin over
  # `go test -list` output, so coverage is exhaustive by construction (every
  # listed test lands in exactly one shard) and the shards stay balanced as
  # tests are added. Each slice runs -p 1 -parallel 1 for memory; the
  # parallelism is across RUNNERS, not within a process.
  #
  # The integration suite is deliberately NOT run under -race here. Its
  # end-to-end multi-node tests (node kill / leave / reshard) are timing-
  # sensitive and flake under -race on GitHub's 2-vCPU runners (a different test
  # each run - convergence / Unavailable transients, NOT data races). A test
  # that is neither consistently green nor blocking is just noise, so rather
  # than run it non-blocking we don't -race it at all: it is gated by the
  # separate, stable, REQUIRED non-race `integration` job below. The race-prone
  # code those tests exercise is already covered under -race by the core
  # packages (fast + cluster) - which is where -race caught a real membership
  # data race.
  race:
    name: race ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fast,      kind: fast }
          - { name: backends,  kind: backends }
          - { name: cluster-0, kind: shard, pkg: ./pkg/cluster, shard: '0', shards: '5' }
          - { name: cluster-1, kind: shard, pkg: ./pkg/cluster, shard: '1', shards: '5' }
          - { name: cluster-2, kind: shard, pkg: ./pkg/cluster, shard: '2', shards: '5' }
          - { name: cluster-3, kind: shard, pkg: ./pkg/cluster, shard: '3', shards: '5' }
          - { name: cluster-4, kind: shard, pkg: ./pkg/cluster, shard: '4', shards: '5' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - name: go test -race (${{ matrix.name }})
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            fast)
              # Every core-module package EXCEPT the two heavy packages that are
              # sharded on their own runners below. Light + quick under -race.
              go test $(go list ./... | grep -vE '/tests/integration$|/pkg/cluster$') \
                -race -timeout 300s -p 1 -parallel 1
              ;;
            backends)
              for m in backends/pebble backends/slate; do
                echo "::group::go test $m -race"
                (cd "$m" && go test ./... -race -timeout 300s -p 1 -parallel 1)
                echo "::endgroup::"
              done
              ;;
            shard)
              # Round-robin partition of the package's tests over `go test -list`
              # output: every test lands in exactly one shard, so the union of all
              # shards is the whole package with no gaps and no overlap.
              ALL=$(go test ${{ matrix.pkg }} -list '.*' | grep -E '^Test' | sort)
              PAT=$(echo "$ALL" | awk 'NR % ${{ matrix.shards }} == ${{ matrix.shard }}' | paste -sd'|' -)
              if [ -z "$PAT" ]; then echo "shard ${{ matrix.shard }}/${{ matrix.shards }} empty - nothing to run"; exit 0; fi
              COUNT=$(echo "$ALL" | awk 'NR % ${{ matrix.shards }} == ${{ matrix.shard }}' | wc -l | tr -d ' ')
              echo "::notice::${{ matrix.pkg }} shard ${{ matrix.shard }}/${{ matrix.shards }}: $COUNT tests"
              go test ${{ matrix.pkg }} -race -run "^(${PAT})\$" -timeout 360s -p 1 -parallel 1
              ;;
          esac

  # Required BEHAVIOR gate for the integration suite, run WITHOUT the race
  # detector. The integration tests are multi-node + timing-sensitive (node
  # kill / leave / reshard) and flake intermittently under -race on 2-vCPU
  # runners (the -race slices in `race` run non-blocking for signal). Plain,
  # they are stable, so this is the merge-gating signal for integration
  # behavior. Round-robin name-sharded for wall-clock; non-race is light enough
  # that 3 shards keep each well under a few minutes.
  integration:
    name: integration ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: '0', shard: '0', shards: '3' }
          - { name: '1', shard: '1', shards: '3' }
          - { name: '2', shard: '2', shards: '3' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - name: go test (no race) ./tests/integration (shard ${{ matrix.shard }}/${{ matrix.shards }})
        run: |
          set -euo pipefail
          ALL=$(go test ./tests/integration -list '.*' | grep -E '^Test' | sort)
          PAT=$(echo "$ALL" | awk 'NR % ${{ matrix.shards }} == ${{ matrix.shard }}' | paste -sd'|' -)
          if [ -z "$PAT" ]; then echo "shard ${{ matrix.shard }}/${{ matrix.shards }} empty - nothing to run"; exit 0; fi
          COUNT=$(echo "$ALL" | awk 'NR % ${{ matrix.shards }} == ${{ matrix.shard }}' | wc -l | tr -d ' ')
          echo "::notice::tests/integration (no -race) shard ${{ matrix.shard }}/${{ matrix.shards }}: $COUNT tests"
          go test ./tests/integration -run "^(${PAT})\$" -timeout 600s -p 1 -parallel 1
