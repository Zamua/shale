name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: vet + build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      # Workspace mode: run vet + build + tests across every module
      # in go.work (core + backends/pebble + backends/slate). This is
      # the dev-loop shape; cross-module changes are tested in one
      # pass without needing to bump versions between modules.
      - name: go vet (workspace)
        run: |
          go vet ./...
          (cd backends/pebble && go vet ./...)
          (cd backends/slate && go vet ./...)

      - name: go build (workspace)
        run: |
          go build ./...
          (cd backends/pebble && go build ./...)
          (cd backends/slate && go build ./...)

      # Full test suite under the race detector. Serialized across
      # packages (-p 1) and within each package (-parallel 1) so the
      # 3-node in-process integration fixtures plus race-detector
      # shadow memory fit inside ubuntu-latest's RAM budget. Local
      # peak RSS measured at ~3 GB with this shape, vs ~4 GB at
      # default parallelism with high variance; serial trades a
      # minute of wall clock for a predictable upper bound.
      - name: go test (race, workspace)
        run: |
          go test ./... -race -timeout 300s -p 1 -parallel 1
          (cd backends/pebble && go test ./... -race -timeout 300s -p 1 -parallel 1)
          (cd backends/slate && go test ./... -race -timeout 300s -p 1 -parallel 1)

      # Per-module release-validation pass: each backend module must
      # also build standalone with GOWORK=off so the published module
      # graph is self-consistent (no implicit workspace dependency on
      # sibling modules). The slate module's slatedb tag is NOT
      # exercised here because it requires the cgo toolchain + a
      # locally-built libslatedb_uniffi cdylib; that path is covered
      # by the `test-slate` Makefile target running locally (and a
      # follow-up MinIO CI fixture when it lands).
      - name: per-module build (GOWORK=off)
        run: |
          (cd backends/pebble && GOWORK=off go build ./...)
          (cd backends/slate && GOWORK=off go build ./...)
