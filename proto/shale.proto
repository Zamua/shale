// shale.proto - the gRPC service exposed by every shale node.
//
// In v0.1, this is the only protocol the shale CLI uses to talk to a
// running shaled. Starting in v0.2 (multi-node), it ALSO serves as the
// inter-node forwarding protocol: when node A receives a Put for a key
// owned by node B, A forwards the operation to B via this same service.
// One protocol, two callers; keeps the wire surface small.
//
// Transactions reach the wire in v0.6 as the unary CommitCAS RPC, an
// optimistic-concurrency (read-set / write-set) commit pinned to a
// single shard owner. Earlier versions (v0.1 through v0.5) did NOT
// expose transactions: a streaming/interactive transaction RPC would
// have needed careful design around connection lifetime + idempotency +
// cross-shard rejection, and holding a backend writer open across client
// think-time is the throughput anti-pattern CAS exists to avoid. The CAS
// shape keeps the owner's transaction tiny and owner-local: no
// transaction is ever open across the network, so the disconnect /
// leak-guard complexity of an interactive proxy mostly evaporates.
syntax = "proto3";

package shale.v1;

option go_package = "github.com/Zamua/shale/pkg/rpc/proto;shalepb";

// ShaleNode is what a shaled process serves on its gRPC listen address.
// All methods are per-key operations or cluster-wide queries; nothing
// here is shard-aware on the wire (the server decides locally whether
// to handle a key or, in v0.2+, forward it).
service ShaleNode {
  // Put stores value under key.
  rpc Put(PutRequest) returns (PutResponse);

  // Get returns the value for key. If absent, the response has
  // not_found=true + an empty value (instead of a gRPC error code, so
  // callers don't have to distinguish "absent" from "transport error").
  rpc Get(GetRequest) returns (GetResponse);

  // Delete removes key. Idempotent: deleting an absent key succeeds.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // ScanPrefix server-streams every key/value pair whose key starts
  // with the given prefix, in key-ascending order. The stream closes
  // cleanly when the scan is exhausted.
  rpc ScanPrefix(ScanPrefixRequest) returns (stream ScanPrefixResponse);

  // LocalScan is an admin-only variant of ScanPrefix that bypasses
  // ring-based routing + reads keys directly from the receiving
  // node's local Backend. Cross-shard machinery in pkg/cluster
  // (Aggregate snapshotting, Stats keys_held) uses it to ask peers
  // "what's actually on YOUR disk" without the request being
  // re-routed through ownerOf, which would otherwise route everything
  // to whichever node owns the empty prefix.
  rpc LocalScan(LocalScanRequest) returns (stream LocalScanResponse);

  // Topology describes the current cluster membership + ring layout.
  // In v0.1 single-node mode, single_node=true + nodes contains exactly
  // this one node. In v0.2+ it reports the full memberlist view.
  rpc Topology(TopologyRequest) returns (TopologyResponse);

  // Stats returns per-node counters: how many keys this node holds,
  // request counts since process start, latency percentiles. The
  // percentile fields are placeholders in v0.1 (always zero) until the
  // observability work in v0.5 wires up a real histogram.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Ping is a no-op round trip for liveness checks. Useful for the CLI
  // `shale ping` subcommand + for inter-node health probes later.
  rpc Ping(PingRequest) returns (PingResponse);

  // MigrateRange is the v0.3 rebalancing transport. The destination
  // (the node whose ring now lists it as owner of the given partitions)
  // initiates the call; the source streams every key/value pair whose
  // shard key falls in any of the requested partitions, then closes
  // with a MigrationDone marker carrying the total key count + a
  // CRC32-based checksum of the concatenated key|value bytes.
  //
  // RangeSpec.ring_generation is carried on the wire for v0.4
  // forward-compatibility (a cluster-wide generation lands with the
  // gossip layer then); v0.3 nodes use per-node monotonic counters
  // that are NOT comparable across peers, so the source does NOT
  // enforce a freshness check on the value. Wrong-owner protection
  // comes from the forwarding loop-guard + the per-key migration
  // guards on the cluster's KV path.
  rpc MigrateRange(RangeSpec) returns (stream MigrateChunk);

  // ProposeRebalance is the operator-facing path for the
  // `shale rebalance --dry-run | --apply | --cancel` subcommand. It
  // returns the per-partition plan the local node would execute against
  // the current ring (or the in-flight plan, if one is running). Exactly
  // one of dry_run / apply / cancel must be true; the server returns
  // InvalidArgument otherwise.
  rpc ProposeRebalance(ProposeRebalanceRequest) returns (ProposeRebalanceResponse);

  // CommitCAS is the v0.6 optimistic-concurrency commit. The client reads
  // via normal Gets, computes locally with no writer held anywhere, then
  // ships a read-set (reads) + write-set (writes) in ONE unary call to the
  // owner of pin_key. The owner verifies it owns pin_key, opens ONE short
  // owner-local backend transaction, validates every ReadCheck (a mismatch
  // is a conflict, not an error), applies the write-set, and commits. A
  // conflict travels as the typed conflict bool on the response, NOT as a
  // gRPC error code (the same not-found-is-not-an-error convention Get
  // uses); a backend / ownership failure travels as the error string.
  rpc CommitCAS(CommitCASRequest) returns (CommitCASResponse);

  // ApplyBatch is a cluster-internal, owner-to-replica RPC (never called
  // from outside the cluster). Like the forwarded/replica Put path it is
  // an apply-only fan-out: the owner has already validated + stamped a CAS
  // write-set and committed it locally, then ships the SAME encoded
  // envelopes to each of the R-1 other replicas via this call so the
  // transactional writes get the R-replica durability single-key writes
  // already have. The replica applies the whole batch in ONE local backend
  // transaction (no re-validation, no re-stamp, written verbatim) and
  // commits, rolling back on any error. It honors the per-key migration
  // guard the same way the replica Put path does: a batch key that is
  // migrating or being received returns codes.ResourceExhausted so the
  // owner's fan-out classifies it transient rather than a failure. No
  // ownership re-check beyond that guard.
  rpc ApplyBatch(ApplyBatchRequest) returns (ApplyBatchResponse);

  // ReshardControl is the cluster-internal control RPC for the v0.8
  // multi-node doubling reshard (cluster-wide freeze barrier). The
  // COORDINATOR (the node where Reshard() was called on a multi-node
  // cluster) drives a 4-phase barrier over every node (including itself)
  // by calling this RPC once per phase: FREEZE -> BISECT -> FLIP ->
  // RESUME (or ABORT on any failure / timeout / membership change). It is
  // direct peer RPC, NOT gossip, because a barrier needs a synchronous ack
  // from every node, which gossip (eventually-consistent broadcast) cannot
  // give. Each phase handler is idempotent. The receiver acks success with
  // an empty error string; a phase failure travels as the error string so
  // the coordinator can ABORT the whole reshard. Never called from outside
  // the cluster (CLI callers use Reshard via the cluster surface, not this
  // wire method directly).
  rpc ReshardControl(ReshardControlRequest) returns (ReshardControlResponse);

  // GenState is the cluster-internal generation-propagation RPC for the
  // v0.8 join-after-reshard fix. A node opening in multi-backend mode WITH
  // seeds (a JOINER, not the founder) calls this on a live seed exactly once
  // during Open - BEFORE it derives or mounts any unit - to learn the
  // cluster's live {generation, unit-count}, then seeds its own routing state
  // from the answer. Without this a fresh joiner starts at generation 0 and,
  // after the cluster has resharded, routes / owns keys at the WRONG
  // generation (orphaning acked writes: "forwarding loop refused: this node
  // does not own the key"). The responder returns its current genSnapshot()
  // {gen, count}. Because a membership change mid-reshard ABORTS the reshard,
  // a join only ever lands at a STABLE generation, so the answer is a single
  // coherent value (no mid-cutover straddle to reason about). Direct peer RPC,
  // NOT gossip: a joiner needs a definite generation before it can serve, a
  // guarantee an eventually-consistent broadcast cannot give. Never called
  // from outside the cluster.
  rpc GenState(GenStateRequest) returns (GenStateResponse);
}

// The `forwarded` flag on each per-key op is the cluster-internal
// loop guard. A node receiving a forwarded=true request that doesn't
// own the key returns FailedPrecondition instead of forwarding again,
// so a stale ring on the sender can't trigger an infinite
// A->B->A->B... ping-pong. Clients dialing this service from outside
// the cluster (CLI, embedded library callers) leave the flag false.

// ReplicaUnitRef is the POSITION-ADDRESSED forward target (v0.8 Phase 2e,
// Option B overlap handoff). The plain forwarded ops carry ONLY the key, and
// the receiver re-resolves the unit+position from the key against its OWN
// live ring index. On the predecessor of a moving position that no longer
// yields the draining position (the position moved away in the ring), so the
// overlap forward instead carries the EXPLICIT ReplicaUnit (gen, unit,
// replica). When this field is set on a forwarded op, the predecessor's
// handler resolves mountMap[ru] DIRECTLY by that ru - explicitly willing to
// serve a Draining-phase entry - rather than re-deriving the position from
// its ring index. It is the ONLY proto change Phase 2e introduces. Absent
// (unset) on every non-overlap forward, so the existing key-only forwarding
// is unchanged.
message ReplicaUnitRef {
  uint64 gen = 1;
  uint32 unit = 2;
  uint32 replica = 3;
}

// -- Put -------------------------------------------------------------

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  bool forwarded = 3;
  // ru, when set, position-addresses this forwarded write to a specific
  // Draining replica on the predecessor (Phase 2e overlap forward). Unset
  // on every ordinary forward.
  ReplicaUnitRef ru = 4;
}

message PutResponse {}

// -- Get -------------------------------------------------------------

message GetRequest {
  bytes key = 1;
  bool forwarded = 2;
  // ru: see PutRequest.ru. Position-addressed overlap forward (Phase 2e).
  ReplicaUnitRef ru = 3;
}

message GetResponse {
  bytes value = 1;
  bool not_found = 2;
}

// -- Delete ----------------------------------------------------------

message DeleteRequest {
  bytes key = 1;
  bool forwarded = 2;
  // ru: see PutRequest.ru. Position-addressed overlap forward (Phase 2e).
  ReplicaUnitRef ru = 3;
}

message DeleteResponse {}

// -- ScanPrefix ------------------------------------------------------

message ScanPrefixRequest {
  bytes prefix = 1;
  bool forwarded = 2;
  // ru: see PutRequest.ru. Position-addressed union scan leg (Phase 2e
  // union reads): when set with forwarded=true, the receiver resolves the
  // explicit ReplicaUnit directly against its mount map (with the same
  // mounted-position fallback the Get leg uses) instead of re-routing by
  // ring ownership - the exact mirror of GetRequest.ru. See docs/SPEC.md
  // "Union scans".
  ReplicaUnitRef ru = 3;
}

message ScanPrefixResponse {
  bytes key = 1;
  bytes value = 2;
}

// -- LocalScan -------------------------------------------------------

message LocalScanRequest {
  bytes prefix = 1;
}

message LocalScanResponse {
  bytes key = 1;
  bytes value = 2;
}

// -- Topology --------------------------------------------------------

message TopologyRequest {}

message TopologyResponse {
  // node_id of the node that served this RPC (the local node).
  string node_id = 1;

  // single_node is true when this is a v0.1-style standalone node with
  // no peers. Callers can short-circuit ring-display logic in that case.
  bool single_node = 2;

  // nodes is the full membership view as seen by this node. In v0.1
  // it contains a single entry (this node).
  repeated NodeInfo nodes = 3;
}

message NodeInfo {
  string node_id = 1;
  string grpc_addr = 2;
}

// -- Stats -----------------------------------------------------------

message StatsRequest {}

message StatsResponse {
  // keys_held is the number of keys the local Backend currently owns.
  // Computed via a prefix-scan of the empty prefix in v0.1; a future
  // version will switch to a maintained counter.
  uint64 keys_held = 1;

  // Lifetime request counters since process start.
  uint64 puts = 2;
  uint64 gets = 3;
  uint64 deletes = 4;
  uint64 scans = 5;

  // Latency percentiles (milliseconds). Placeholders in v0.1 (zero);
  // wired up to a real histogram in v0.5 alongside the Prometheus
  // metrics work.
  double latency_ms_p50 = 6;
  double latency_ms_p99 = 7;
}

// -- Ping ------------------------------------------------------------

message PingRequest {}

message PingResponse {}

// -- MigrateRange ----------------------------------------------------

// RangeSpec identifies which partitions the destination claims it now
// owns + the ring generation the destination is reasoning from. The
// generation is monotonic + incremented per ring change so the source
// can detect stale requests during the brief windows when peers
// disagree about ownership.
message RangeSpec {
  // partition_ids the destination claims ownership of. The source
  // iterates its local Backend over keys whose shard key falls into
  // any of these partitions.
  repeated uint64 partition_ids = 1;

  // ring_generation is the destination's view of the ring at the
  // moment it issued the request. v0.3 nodes use per-node monotonic
  // counters that are NOT cluster-comparable, so the source does
  // NOT enforce a freshness check on this value (every stream is
  // accepted regardless). The field is carried on the wire for
  // v0.4 forward-compatibility: a gossiped cluster-wide generation
  // will land then + the source-side rejection of stale requests
  // can become meaningful.
  uint64 ring_generation = 2;
}

// MigrateChunk is one message in the server-streaming response. Each
// message is either a key/value pair or, exactly once at the end, a
// MigrationDone marker. Receivers MUST treat the stream as finished
// when they see a done body, even if more messages appear after.
message MigrateChunk {
  oneof body {
    KeyValue kv = 1;
    MigrationDone done = 2;
  }
}

// KeyValue carries one migrated pair. Keys are raw bytes as stored in
// the source Backend; the destination writes them through its own
// Backend.Put unchanged.
message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

// MigrationDone is the terminal marker. total_keys is the number of
// KeyValue messages that preceded it on the stream; checksum is the
// CRC32 (IEEE polynomial) of the concatenated key|value bytes in the
// order they were sent. The destination recomputes the checksum as it
// receives and rolls back the range on mismatch.
message MigrationDone {
  uint64 total_keys = 1;
  bytes checksum = 2;
}

// -- ProposeRebalance ------------------------------------------------

// ProposeRebalanceRequest carries the operator's intent. Exactly one
// of dry_run / apply / cancel must be true; the server returns
// InvalidArgument otherwise.
message ProposeRebalanceRequest {
  bool dry_run = 1;
  bool apply = 2;
  bool cancel = 3;
}

// ProposeRebalanceResponse returns the per-partition plan the local
// node would execute (dry_run / apply) or has just cancelled (cancel).
message ProposeRebalanceResponse {
  repeated RangePlanItem ranges = 1;
}

// RangePlanItem is one row of the rebalance plan: which partition,
// who owns it now, who would own it after the plan applies, and a
// rough size hint for operators eyeballing cost.
message RangePlanItem {
  uint64 partition_id = 1;
  string current_owner = 2;
  string proposed_owner = 3;
  uint64 estimated_key_count = 4;
}

// -- CommitCAS -------------------------------------------------------

// CommitCASRequest carries one optimistic-concurrency commit. pin_key is
// the key that pinned the shard; the owner verifies it owns this key and
// does NOT re-check ownership per read/write key (the client's cross-shard
// guard already ensured every key shards to the same owner). reads is the
// read-set the owner re-validates; writes is the write-set the owner
// applies in order once validation passes.
message CommitCASRequest {
  bytes pin_key = 1;

  // isolation_level mirrors backend.IsolationLevel
  // (0=SnapshotIsolation, 1=SerializableSnapshot). The owner opens its
  // local transaction at this level.
  int32 isolation_level = 2;

  repeated ReadCheck reads = 3;
  repeated WriteOp writes = 4;
}

// ReadCheck is one entry in the read-set: the value the client observed
// for key at read time. The owner re-reads key inside its transaction and
// compares. expect_absent=true means the key must NOT exist (a found value
// is a conflict) and expected_value is ignored; otherwise the current
// value must match expected_value byte-for-byte.
message ReadCheck {
  bytes key = 1;
  bytes expected_value = 2;
  bool expect_absent = 3;
}

// WriteOp is one entry in the write-set. delete=true deletes key (value is
// ignored); else it Puts value under key.
message WriteOp {
  bytes key = 1;
  bytes value = 2;
  bool delete = 3;
}

// CommitCASResponse reports the outcome. A conflict is NOT an error: it is
// the expected OCC retry signal, so it travels as a typed bool rather than a
// gRPC error code. committed and conflict are mutually exclusive; error is
// set only on a NOT-committed failure. under_replicated is an ADDITIONAL flag
// alongside committed==true: the owner-local commit durably applied but the
// replica fan-out missed W (a success with degraded replication, NOT a
// failure). It carries committed==true across the wire so a forwarding node
// treats it as success and does NOT re-run the transaction (re-committing an
// already-durable write). See docs/SPEC.md "The four commit outcomes".
message CommitCASResponse {
  bool committed = 1;
  bool conflict = 2;
  string error = 3;
  bool under_replicated = 4;
}

// -- ApplyBatch ------------------------------------------------------

// ApplyBatchRequest carries one CAS write-set fan-out from owner to
// replica. The owner has already committed these envelopes locally; the
// replica applies the whole batch (all writes) in ONE local transaction,
// apply-only, and commits. Any error rolls the entire batch back.
message ApplyBatchRequest {
  repeated EnvelopeWrite writes = 1;
}

// EnvelopeWrite is one entry in the fan-out batch: a key plus its already
// Encode()d envelope (shared stamp + payload). An empty-payload envelope
// is a tombstone. The replica writes the envelope bytes verbatim and never
// re-stamps.
message EnvelopeWrite {
  bytes key = 1;
  bytes envelope = 2;
}

// ApplyBatchResponse reports the outcome. A non-empty error means the
// replica failed to apply the batch and rolled back. A migration-guard
// rejection travels as a gRPC codes.ResourceExhausted error (transient),
// not in this field.
message ApplyBatchResponse {
  string error = 1;
}

// -- ReshardControl --------------------------------------------------

// ReshardPhase is the barrier phase the coordinator is driving. The
// receiving node's per-phase handler is idempotent (a repeated FREEZE is
// a no-op while already frozen for the same target generation, etc.).
enum ReshardPhase {
  // RESHARD_PHASE_UNSPECIFIED is the proto3 zero value; the server rejects
  // it with an error so a malformed request never silently no-ops.
  RESHARD_PHASE_UNSPECIFIED = 0;

  // FREEZE pauses writes cluster-wide: Put / Delete / Begin (and the CAS
  // commit write path) return a retryable error (codes.Unavailable) until
  // RESUME or ABORT. Reads continue, served from the live gen-g units.
  RESHARD_PHASE_FREEZE = 1;

  // BISECT runs the local per-node bisect under the freeze: for each gen-g
  // unit this node owns, copy its keys into fresh gen-(g+1) units K and
  // K+N (created in the shared backing). With writes frozen the copy is
  // static, so there is no catch-up window.
  RESHARD_PHASE_BISECT = 2;

  // FLIP atomically advances this node's genState to the target generation
  // (routing now resolves the 2N units) and retires its old gen-g units.
  // No node flips until every node has bisected; the freeze still holds.
  RESHARD_PHASE_FLIP = 3;

  // RESUME unfreezes: writes resume at the new generation. The 2N units
  // then redistribute across nodes via the Phase 3 lease handoff.
  RESHARD_PHASE_RESUME = 4;

  // ABORT is the fail-safe: unfreeze, discard any half-built gen-(g+1)
  // units (harmless, never routed), and STAY at the current generation.
  RESHARD_PHASE_ABORT = 5;
}

// ReshardControlRequest carries one barrier phase + the target generation
// g+1 the coordinator is driving toward. target_gen lets a node reject a
// request that disagrees with its own current generation (a stale or
// crossed reshard) rather than apply it blindly.
message ReshardControlRequest {
  ReshardPhase phase = 1;
  uint64 target_gen = 2;
}

// ReshardControlResponse is the node's ack. An empty error means the phase
// was applied (the barrier ack the coordinator waits for); a non-empty
// error means the node could not apply the phase, which the coordinator
// treats as an ABORT trigger.
message ReshardControlResponse {
  string error = 1;
}

// -- GenState --------------------------------------------------------

// GenStateRequest carries no parameters: the joiner just asks the seed for
// its current generation state. The seed answers from its own genSnapshot().
message GenStateRequest {}

// GenStateResponse carries the responder's live {generation, unit-count}.
// The joiner commits genState{gen: generation, count: unit_count, cutOver
// empty} before mounting any unit. unit_count is carried explicitly (rather
// than re-derived from the joiner's configured UnitCount doubled `generation`
// times) so the contract is unambiguous and a future non-doubling resize
// cannot silently desync the count from the generation.
message GenStateResponse {
  uint64 generation = 1;
  uint32 unit_count = 2;
}
