// shale.proto - the gRPC service exposed by every shale node.
//
// In v0.1, this is the only protocol the shale CLI uses to talk to a
// running shaled. Starting in v0.2 (multi-node), it ALSO serves as the
// inter-node forwarding protocol: when node A receives a Put for a key
// owned by node B, A forwards the operation to B via this same service.
// One protocol, two callers; keeps the wire surface small.
//
// Transactions (Backend.Begin / Commit / Rollback) are intentionally
// NOT exposed in v0.1. A streaming transaction RPC needs careful design
// around connection lifetime + idempotency + cross-shard rejection; it
// will land in v0.2+ alongside the rest of the multi-node machinery.
// Local-process apps that need transactions today should use the
// cluster.Cluster.Begin API directly without going through gRPC.
syntax = "proto3";

package shale.v1;

option go_package = "github.com/Zamua/shale/pkg/rpc/proto;shalepb";

// ShaleNode is what a shaled process serves on its gRPC listen address.
// All methods are per-key operations or cluster-wide queries; nothing
// here is shard-aware on the wire (the server decides locally whether
// to handle a key or, in v0.2+, forward it).
service ShaleNode {
  // Put stores value under key.
  rpc Put(PutRequest) returns (PutResponse);

  // Get returns the value for key. If absent, the response has
  // not_found=true + an empty value (instead of a gRPC error code, so
  // callers don't have to distinguish "absent" from "transport error").
  rpc Get(GetRequest) returns (GetResponse);

  // Delete removes key. Idempotent: deleting an absent key succeeds.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // ScanPrefix server-streams every key/value pair whose key starts
  // with the given prefix, in key-ascending order. The stream closes
  // cleanly when the scan is exhausted.
  rpc ScanPrefix(ScanPrefixRequest) returns (stream ScanPrefixResponse);

  // LocalScan is an admin-only variant of ScanPrefix that bypasses
  // ring-based routing + reads keys directly from the receiving
  // node's local Backend. Cross-shard machinery in pkg/cluster
  // (Aggregate snapshotting, Stats keys_held) uses it to ask peers
  // "what's actually on YOUR disk" without the request being
  // re-routed through ownerOf, which would otherwise route everything
  // to whichever node owns the empty prefix.
  rpc LocalScan(LocalScanRequest) returns (stream LocalScanResponse);

  // Topology describes the current cluster membership + ring layout.
  // In v0.1 single-node mode, single_node=true + nodes contains exactly
  // this one node. In v0.2+ it reports the full memberlist view.
  rpc Topology(TopologyRequest) returns (TopologyResponse);

  // Stats returns per-node counters: how many keys this node holds,
  // request counts since process start, latency percentiles. The
  // percentile fields are placeholders in v0.1 (always zero) until the
  // observability work in v0.5 wires up a real histogram.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Ping is a no-op round trip for liveness checks. Useful for the CLI
  // `shale ping` subcommand + for inter-node health probes later.
  rpc Ping(PingRequest) returns (PingResponse);

  // MigrateRange is the v0.3 rebalancing transport. The destination
  // (the node whose ring now lists it as owner of the given partitions)
  // initiates the call; the source streams every key/value pair whose
  // shard key falls in any of the requested partitions, then closes
  // with a MigrationDone marker carrying the total key count + a
  // CRC32-based checksum of the concatenated key|value bytes.
  //
  // RangeSpec.ring_generation lets the source reject a request whose
  // ring view is stale relative to its own: if the destination's
  // generation is behind the source's current ring, the source returns
  // FailedPrecondition rather than streaming data that will get
  // discarded on the next Evaluate pass.
  rpc MigrateRange(RangeSpec) returns (stream MigrateChunk);

  // ProposeRebalance is the operator-facing path for the
  // `shale rebalance --dry-run | --apply | --cancel` subcommand. It
  // returns the per-partition plan the local node would execute against
  // the current ring (or the in-flight plan, if one is running). Exactly
  // one of dry_run / apply / cancel must be true; the server returns
  // InvalidArgument otherwise.
  rpc ProposeRebalance(ProposeRebalanceRequest) returns (ProposeRebalanceResponse);
}

// The `forwarded` flag on each per-key op is the cluster-internal
// loop guard. A node receiving a forwarded=true request that doesn't
// own the key returns FailedPrecondition instead of forwarding again,
// so a stale ring on the sender can't trigger an infinite
// A->B->A->B... ping-pong. Clients dialing this service from outside
// the cluster (CLI, embedded library callers) leave the flag false.

// -- Put -------------------------------------------------------------

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  bool forwarded = 3;
}

message PutResponse {}

// -- Get -------------------------------------------------------------

message GetRequest {
  bytes key = 1;
  bool forwarded = 2;
}

message GetResponse {
  bytes value = 1;
  bool not_found = 2;
}

// -- Delete ----------------------------------------------------------

message DeleteRequest {
  bytes key = 1;
  bool forwarded = 2;
}

message DeleteResponse {}

// -- ScanPrefix ------------------------------------------------------

message ScanPrefixRequest {
  bytes prefix = 1;
  bool forwarded = 2;
}

message ScanPrefixResponse {
  bytes key = 1;
  bytes value = 2;
}

// -- LocalScan -------------------------------------------------------

message LocalScanRequest {
  bytes prefix = 1;
}

message LocalScanResponse {
  bytes key = 1;
  bytes value = 2;
}

// -- Topology --------------------------------------------------------

message TopologyRequest {}

message TopologyResponse {
  // node_id of the node that served this RPC (the local node).
  string node_id = 1;

  // single_node is true when this is a v0.1-style standalone node with
  // no peers. Callers can short-circuit ring-display logic in that case.
  bool single_node = 2;

  // nodes is the full membership view as seen by this node. In v0.1
  // it contains a single entry (this node).
  repeated NodeInfo nodes = 3;
}

message NodeInfo {
  string node_id = 1;
  string grpc_addr = 2;
}

// -- Stats -----------------------------------------------------------

message StatsRequest {}

message StatsResponse {
  // keys_held is the number of keys the local Backend currently owns.
  // Computed via a prefix-scan of the empty prefix in v0.1; a future
  // version will switch to a maintained counter.
  uint64 keys_held = 1;

  // Lifetime request counters since process start.
  uint64 puts = 2;
  uint64 gets = 3;
  uint64 deletes = 4;
  uint64 scans = 5;

  // Latency percentiles (milliseconds). Placeholders in v0.1 (zero);
  // wired up to a real histogram in v0.5 alongside the Prometheus
  // metrics work.
  double latency_ms_p50 = 6;
  double latency_ms_p99 = 7;
}

// -- Ping ------------------------------------------------------------

message PingRequest {}

message PingResponse {}

// -- MigrateRange ----------------------------------------------------

// RangeSpec identifies which partitions the destination claims it now
// owns + the ring generation the destination is reasoning from. The
// generation is monotonic + incremented per ring change so the source
// can detect stale requests during the brief windows when peers
// disagree about ownership.
message RangeSpec {
  // partition_ids the destination claims ownership of. The source
  // iterates its local Backend over keys whose shard key falls into
  // any of these partitions.
  repeated uint64 partition_ids = 1;

  // ring_generation is the destination's view of the ring at the
  // moment it issued the request. The source compares this against
  // its own current generation; if the destination is behind, the
  // source returns FailedPrecondition + the next Evaluate pass on
  // the destination will retry against the new ring.
  uint64 ring_generation = 2;
}

// MigrateChunk is one message in the server-streaming response. Each
// message is either a key/value pair or, exactly once at the end, a
// MigrationDone marker. Receivers MUST treat the stream as finished
// when they see a done body, even if more messages appear after.
message MigrateChunk {
  oneof body {
    KeyValue kv = 1;
    MigrationDone done = 2;
  }
}

// KeyValue carries one migrated pair. Keys are raw bytes as stored in
// the source Backend; the destination writes them through its own
// Backend.Put unchanged.
message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

// MigrationDone is the terminal marker. total_keys is the number of
// KeyValue messages that preceded it on the stream; checksum is the
// CRC32 (IEEE polynomial) of the concatenated key|value bytes in the
// order they were sent. The destination recomputes the checksum as it
// receives and rolls back the range on mismatch.
message MigrationDone {
  uint64 total_keys = 1;
  bytes checksum = 2;
}

// -- ProposeRebalance ------------------------------------------------

// ProposeRebalanceRequest carries the operator's intent. Exactly one
// of dry_run / apply / cancel must be true; the server returns
// InvalidArgument otherwise.
message ProposeRebalanceRequest {
  bool dry_run = 1;
  bool apply = 2;
  bool cancel = 3;
}

// ProposeRebalanceResponse returns the per-partition plan the local
// node would execute (dry_run / apply) or has just cancelled (cancel).
message ProposeRebalanceResponse {
  repeated RangePlanItem ranges = 1;
}

// RangePlanItem is one row of the rebalance plan: which partition,
// who owns it now, who would own it after the plan applies, and a
// rough size hint for operators eyeballing cost.
message RangePlanItem {
  uint64 partition_id = 1;
  string current_owner = 2;
  string proposed_owner = 3;
  uint64 estimated_key_count = 4;
}
